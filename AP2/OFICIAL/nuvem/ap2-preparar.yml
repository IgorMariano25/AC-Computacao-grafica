name: AP2 - Preparacao na nuvem sem render
on:
  push:
    branches: [codex/ap2-oficial-cloud-20261114]
    paths: ['AP2/OFICIAL/scripts/**', '.github/workflows/ap2-preparar.yml']
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Bibliotecas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxrender1 libxi6 libxfixes3 libxkbcommon0 libgl1 libegl1 libsm6 libxxf86vm1
      - name: Blender 4.5.3 LTS com checksum
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo "975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Inspecionar sem renderizar
        run: |
          mkdir -p AP2/OFICIAL/nuvem
          set -o pipefail
          "$RUNNER_TEMP/blender-4.5.3-linux-x64/blender" -b --factory-startup --disable-autoexec --python-exit-code 1 --python AP2/OFICIAL/scripts/inspecionar_nuvem.py 2>&1 | tee AP2/OFICIAL/nuvem/log_inspecao.txt
      - name: Devolver resultados na branch de trabalho
        if: always()
        env:
          TASK_STATUS: ${{ job.status }}
        run: |
          mkdir -p AP2/OFICIAL/nuvem
          python3 - <<'PY'
          import os,json,platform,hashlib
          from pathlib import Path
          root=Path('AP2/OFICIAL')
          info={'status':os.environ['TASK_STATUS'],'ambiente':'GitHub Actions github-hosted ubuntu-22.04','plataforma':platform.platform(),'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'commit_entrada':os.environ['GITHUB_SHA'],'render_executado':False,'arquivos':{str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and p.suffix in ('.blend','.json','.txt')}}
          (root/'nuvem/registro_execucao.json').write_text(json.dumps(info,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f AP2/OFICIAL/nuvem/*.json AP2/OFICIAL/nuvem/*.txt
          if [ -f AP2/OFICIAL/AP2_IgorMariano.blend ]; then git add -f AP2/OFICIAL/AP2_IgorMariano.blend; fi
          if ! git diff --cached --quiet; then
            git commit -m 'AP2: resultados de preparacao na nuvem sem render [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
